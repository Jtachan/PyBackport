site_name: PyBackport
repo_url: https://github.com/Jtachan/PyBackport

nav:
  - Home: "index.md"
  - Backports:
      - Builtins: "builtins.md"
      - Enum: "enum.md"

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/toggle-switch-off
        name: Switch to system preference
  features:
    - content.code.annotate
    - content.code.copy
    - navigation.instant
    - navigation.footer
    - navigation.sections
    - search.suggest
    - search.highlight
    - navigation.top
    - navigation.tracking
    - search.share
    - search.suggest
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - footnotes
  - toc:
      permalink: true
plugins:
  - search
  - autorefs
  - mkdocstrings:
     handlers:
       python: # https://mkdocstrings.github.io/python/usage/
         options:
           # General options
           show_bases: true
           show_source: false
           # Headings
           heading_level: 1
           parameter_headings: true
           show_root_heading: true
           show_root_full_path: true
           show_root_members_full_path: false
           show_category_heading: false
           # Members
           inherited_members: true
           members_order: source
           filters:
             - "!^_.*$"
           group_by_category: true
           show_submodules: true
           # Docstrings
           docstring_style: numpy
           docstring_section_style: table
           merge_init_into_class: true
           # Signatures
           annotations_path: source
           line_length: 88
           modernize_annotations: true
           overloads_only: true
           show_signature: true
           show_signature_annotations: true
           separate_signature: true
           show_overloads: true
