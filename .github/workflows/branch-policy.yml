name: Branch Policy
on:
  pull_request

jobs:
  enforce-allowed-branches:
    name: Check PR source branch naming
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Verify source branch for protected targets
        run: |
          BASE="${{ github.event.pull_request.base.ref }}"
          HEAD="${{ github.event.pull_request.head.ref }}"

          echo "Base branch: $BASE"
          echo "Source branch: $HEAD"

          # Only enforce when targeting main or master
          if [[ "$BASE" == "main" || "$BASE" == "master" ]]; then
            if [[ "$HEAD" =~ ^release/v.+ || "$HEAD" =~ ^hotfix/v.+ ]]; then
              echo "✅ Allowed: $HEAD -> $BASE"
              exit 0
            else
              echo "❌ Disallowed: Only branches named 'release/v*' or 'hotfix/v*' may target '$BASE'."
              echo "    Examples: release/v1.2.3, hotfix/v2.0.1"
              exit 1
            fi
          else
            echo "Rule not applicable for base '$BASE'."
            exit 0
          fi